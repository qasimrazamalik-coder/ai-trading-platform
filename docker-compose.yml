services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports: ["4222:4222", "8222:8222"]

  clickhouse:
    image: clickhouse/clickhouse-server:25-alpine
    ports: ["8123:8123", "9000:9000"]
    volumes: ["clickhouse_data:/var/lib/clickhouse"]

volumes:
  postgres_data:
  clickhouse_data:
