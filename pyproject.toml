[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-os"
version = "1.0.0"
description = "Open, self-hosted multi-asset quantitative trading platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Quant OS"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
marketdata = [
  "pyarrow>=18",
]
crypto = [
  "ccxt>=4.5,<5",  # read-only spot market data from more exchanges
]
ml = [
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
  "lightgbm>=4,<5",
  "catboost>=1.2,<2",
  "joblib>=1.4,<2",
]
dl = [
  "torch>=2.7,<3",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "hypothesis>=6,<7",
  "httpx>=0.27,<1",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.8,<3",
]

[tool.setuptools]
package-dir = {"" = "packages/core/src"}

[tool.setuptools.packages.find]
where = ["packages/core/src"]
include = ["quant_os_core*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["packages/core/tests", "tests"]
pythonpath = ["packages/core/src", "apps/api/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/core/src", "apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = ["packages/core/src", "apps/api/src"]

# Third-party libraries that ship no type information (or are optional extras that may
# be absent). Strict checking still applies to our own packages.
[[tool.mypy.overrides]]
module = [
  "catboost.*",
  "lightgbm.*",
  "scipy.*",
  "sklearn.*",
  "statsmodels.*",
  "torch.*",
  "xgboost.*",
  "yfinance.*",
]
ignore_missing_imports = true

# nn.Module is Any when torch is absent, and Module.__call__ returns Any when it is present.
[[tool.mypy.overrides]]
module = ["quant_os_core.ml.deep"]
disallow_subclassing_any = false
warn_return_any = false
