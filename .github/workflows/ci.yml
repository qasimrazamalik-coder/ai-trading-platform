name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      MYPY_MAX_ERRORS: "53" # pre-existing baseline in packages/core; never raise it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to diff against the base branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,ml]"

      - name: Tests (no network)
        run: pytest -q

      - name: Type-check the API app
        run: mypy apps/api/src

      - name: Dependency audit
        run: pip-audit

      - name: Ruff on changed Python files only
        # The repo has pre-existing ruff findings, so only files this push/PR changed are checked.
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="origin/main"
          fi
          base_commit="$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base_commit" HEAD -- '*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files."
            exit 0
          fi
          printf 'Checking %s\n' "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"

      - name: Mypy (fail only above the baseline)
        working-directory: packages/core
        run: |
          set +e
          mypy src > mypy.log 2>&1
          set -e
          tail -n 5 mypy.log
          if grep -q "^Success:" mypy.log; then
            count=0
          else
            count="$(grep -oE '^Found [0-9]+ errors?' mypy.log | grep -oE '[0-9]+' || true)"
          fi
          if [ -z "$count" ]; then
            echo "Could not read the mypy error count"; cat mypy.log; exit 1
          fi
          echo "mypy errors: $count (max $MYPY_MAX_ERRORS)"
          if [ "$count" -gt "$MYPY_MAX_ERRORS" ]; then
            echo "mypy error count rose above the baseline"; exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --prefix apps/web --ignore-scripts
      - run: npm --prefix apps/web run check
      - run: npm --prefix apps/web run build
