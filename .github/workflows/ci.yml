name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      # The runner's Python ships an old setuptools that pip-audit flags.
      - run: python -m pip install --upgrade pip setuptools
      # The ML tests need scikit-learn and the boosters (extra "ml") and PyTorch (extra "dl");
      # the CPU-only torch wheel keeps the install small.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,ml]'
      - run: ruff check .
      - run: mypy packages/core/src apps/api/src
      - run: pytest --cov=quant_os_core --cov=quant_os_api --cov-report=term --cov-fail-under=94
      - run: pip-audit
      - run: npm install --prefix apps/web --ignore-scripts
      - run: npm --prefix apps/web run check
      - run: npm --prefix apps/web run build
